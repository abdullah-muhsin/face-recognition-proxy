# Complete vps.itplus.club virtual host for the Go PushSDK gateway.
# The upstream is bound only to 127.0.0.1:18080 by Compose.

# Transport metadata only: never log request/response bodies, authentication
# headers, or query strings. Connection IDs distinguish TCP reconnects from
# PushSDK authentication; timings distinguish client and upstream failures.
log_format pushsdk_transport escape=json
    '{"time":"$time_iso8601","client":"$remote_addr",'
    '"connection":"$connection","connectionRequests":$connection_requests,'
    '"method":"$request_method","path":"$uri","protocol":"$server_protocol",'
    '"tls":"$ssl_protocol","status":$status,"completion":"$request_completion",'
    '"requestSeconds":$request_time,"requestBytes":$request_length,"sentBytes":$bytes_sent,'
    '"upstreamStatus":"$upstream_status","upstreamConnectSeconds":"$upstream_connect_time",'
    '"upstreamHeaderSeconds":"$upstream_header_time","upstreamResponseSeconds":"$upstream_response_time"}';

server {
    listen 80;
    listen [::]:80;
    server_name vps.itplus.club;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vps.itplus.club;

    ssl_certificate /etc/letsencrypt/live/vps.itplus.club/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.itplus.club/privkey.pem;
    # Keep the RSA companion certificate required by older embedded terminals.
    ssl_certificate /etc/letsencrypt/live/vps.itplus.club-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vps.itplus.club-rsa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pushsdk-gateway-access.log;
    error_log /var/log/nginx/pushsdk-gateway-error.log warn;
    client_max_body_size 8m;

    # Health and metrics are host-only checks; neither is a public endpoint.
    location = /healthz { return 404; }
    location = /readyz { return 404; }
    location = /metrics { return 404; }

    location ^~ /iot/ {
        # Location-level access logs replace inherited logs: retain both.
        access_log /var/log/nginx/pushsdk-gateway-access.log;
        access_log /var/log/nginx/pushsdk-gateway-transport.log pushsdk_transport;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# Public TLS edge for the Hikvision Push SDK gateway.
#
# Replace pushsdk.example.com and the certificate paths before enabling this
# virtual host. The terminal must use this exact DNS name, TCP port 443, and
# HTTPS in its Push SDK configuration. Its certificate validation must remain
# enabled.

server {
    listen 80;
    listen [::]:80;
    server_name pushsdk.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pushsdk.example.com;

    ssl_certificate /etc/letsencrypt/live/pushsdk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pushsdk.example.com/privkey.pem;
    # An RSA companion certificate keeps older embedded terminals compatible.
    ssl_certificate /etc/letsencrypt/live/pushsdk.example.com-rsa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pushsdk.example.com-rsa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/pushsdk-gateway-access.log;
    error_log /var/log/nginx/pushsdk-gateway-error.log warn;

    # The gateway accepts a maximum 2 MiB JPEG inside the vendor's base64 and
    # multipart envelope. The application independently enforces 4 MiB.
    client_max_body_size 4m;

    # No unauthenticated gateway status endpoint is exposed to the Internet.
    location = /healthz {
        return 404;
    }

    # This is the only public route family. The gateway validates the full,
    # documented Push SDK endpoint and the configured terminal serial number.
    location ^~ /iot/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-PushSDK-Device-Address "[$remote_addr]:$remote_port";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }

    # Laravel accepts these only over the internal Docker network from the
    # gateway. The public dashboard must never proxy the private API.
    location ^~ /api/internal/push-sdk/ {
        deny all;
        return 404;
    }

    # The attendance dashboard shares the public TLS hostname. Its container
    # is published only to 127.0.0.1:8002, so Nginx is the sole public edge.
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}

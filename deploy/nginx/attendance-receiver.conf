# Optional host-level HTTP edge for a Docker-published receiver.
# Replace attendance.example.com and enable TLS before exposing this publicly.

server {
    listen 80;
    server_name attendance.example.com;

    access_log /var/log/nginx/attendance-receiver-access.log;
    error_log /var/log/nginx/attendance-receiver-error.log warn;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}

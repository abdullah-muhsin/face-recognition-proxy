# Host-level HTTP edge for the attendance receiver demo.
# Install as /etc/nginx/conf.d/attendance-receiver.conf on the VPS.

server {
    listen 209.42.26.200:8001;
    server_name 209.42.26.200;

    access_log /var/log/nginx/attendance-receiver-access.log;
    error_log /var/log/nginx/attendance-receiver-error.log warn;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 8001;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}

# Optional public HTTP edge for the Push SDK attendance demo's operator UI.
# Replace attendance-pushsdk.example.com and enable TLS before exposing it.

server {
    listen 80;
    server_name attendance-pushsdk.example.com;

    access_log /var/log/nginx/attendance-receiver-pushsdk-access.log;
    error_log /var/log/nginx/attendance-receiver-pushsdk-error.log warn;

    client_max_body_size 4m;

    # The dedicated Push SDK gateway calls this path over its private Docker
    # network. A terminal must never reach Laravel on this endpoint.
    location ^~ /api/internal/push-sdk/ {
        deny all;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 130s;
        proxy_send_timeout 130s;
    }
}
